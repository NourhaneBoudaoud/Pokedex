name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx expo lint

      # Typed routes (.expo/types) are generated by Expo and not committed.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
